name: Unzip Source Code

on:

  workflow_dispatch:

  push:

    paths:

      - "*.zip"

permissions:

  contents: write

jobs:

  unzip:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Extract ZIP

        run: |

          mkdir -p /tmp/source

          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          test -n "$ZIP"

          unzip -o "$ZIP" -d /tmp/source

          cp -R /tmp/source/. .

          rm -f "$ZIP"

      - name: Commit extracted files

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git diff --cached --quiet || git commit -m "Extract source ZIP"

          git push
